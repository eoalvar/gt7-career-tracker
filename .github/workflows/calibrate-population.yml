name: Maintain GT7 Career Population

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  push:
    paths:
      - "src/calibrate_population.py"
      - "src/calibrate_population_resilient.py"
      - "src/maintain_population.py"
      - ".github/workflows/calibrate-population.yml"

permissions:
  contents: write

concurrency:
  group: maintain-gt7-career-population
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python source
        run: python -m compileall -q src

      - name: Refresh current career snapshot locally
        env:
          GT7_PSN_ID: crazy_rooster74
        run: python src/collect_rating.py

      - name: Maintain rolling empirical population
        env:
          GT7_PSN_ID: crazy_rooster74
          GT7_CALIBRATION_EVENTS_PER_RUN: "3"
          GT7_CALIBRATION_MIN_VALID: "100"
          GT7_CALIBRATION_MIN_RACES: "20"
          GT7_DR_WEIGHT_SCALE: "5000"
          GT7_MAINTENANCE_TARGET: "2200"
          GT7_MAINTENANCE_REPLACE: "100"
          GT7_MAINTENANCE_SAMPLE: "600"
        run: python src/maintain_population.py

      - name: Regenerate career report locally
        run: python src/generate_report.py

      - name: Commit population artifacts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The regular career workflow owns volatile personal snapshots/history.
          git restore --staged data/career.db data/latest_rating.json data/latest_career.json data/latest_profile_fields.json reports/latest.md 2>/dev/null || true
          git restore data/career.db data/latest_rating.json data/latest_career.json data/latest_profile_fields.json reports/latest.md 2>/dev/null || true

          git add data/population_calibration.json data/population_profiles.json
          if git diff --cached --quiet; then
            echo "No population maintenance changes to commit."
          else
            git commit -m "Maintain GT7 population reference"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
