name: Collect GT7 Career Rating

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/collect-rating.yml"

permissions:
  contents: write

concurrency:
  group: collect-gt7-career-rating
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python source
        run: python -m compileall -q src

      - name: Collect DR, SR and Sport career statistics
        env:
          GT7_PSN_ID: crazy_rooster74
        run: python src/collect_rating.py

      - name: Record calibrated performance history
        run: python src/record_performance_history.py

      - name: Generate career report
        run: python src/generate_report.py

      - name: Commit updated career data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/career.db data/latest_rating.json data/latest_career.json data/latest_profile_fields.json reports/latest.md
          if git diff --cached --quiet; then
            echo "No career data changes to commit."
          else
            git commit -m "Update GT7 career data"
            git push
          fi
