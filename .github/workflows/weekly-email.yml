name: GT7 Career Weekly Email

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "America/Sao_Paulo"

permissions:
  contents: read

jobs:
  send-weekly-career-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send weekly career report by email
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python src/send_weekly_email.py
